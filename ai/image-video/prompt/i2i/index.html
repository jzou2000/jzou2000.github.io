<div class="van-content-container">

  <div class="van-content">
    <h1>Image to Image</h1>
    <p>We try to change prompt according to a reference <a href="https://www.runcomfy.com/models/tongyi-mai/z-image/turbo/image-to-image">image from RunComfy</a>.</p>
<div id="van-list-0" class="van-img-list van-img-list-small"></div>
<script type="module">
import { renderImgYtList } from '/js/img-yt-list.js';

try {
  renderImgYtList('van-list-0', "\n\n- img: prompt-i2i-input.webp\n  title: Image Reference\n  text: |\n    This is the image that is used to generate image.\n\n- img: prompt-i2i-runcomfy-zimage.webp\n  title: \u0022RunComfy: Z-Image, Image to Image\u0022\n  text: |\n    ### origin\n    A photorealistic image of a woman wearing a pair of sunglass\n\n    ### enhanced\n    A highly detailed, photorealistic image of a confident woman wearing sleek, modern sunglasses with reflective lenses, capturing the glint of sunlight. Her features are gracefully highlighted, framed by flowing hair subtly tousled by the wind. She stands in an urban setting with soft shadows and warm natural lighting, evoking elegance and sophistication.\n\n- img: prompt-i2i-runcomfy-zimage.webp\n  title: Z-Image\n  text: An intimate, flash-lit\n\n- img: t2i-zimage\n  title: Z-Image\n  txt: |\n    sss\n\n- img: t2i-zimage\n  title: Z-Image\n  txt: |\n    sss\n\n",
    {
      size: "small",
      circle: "false",
      shadow: "false",
      blank: "true"
    }
  );
} catch (e) {
  console.error('Error rendering van-list:', e);
}
</script>

  </div>
</div>
