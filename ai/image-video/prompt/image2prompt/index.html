<script type="module">
import { renderImgYtList } from '/js/img-yt-list.js';

try {
  renderImgYtList('van-list-0', "\n\n- img: jason4.webp\n  title: Original Picture\n  text: |\n        I use this picture to generate prompt on different platforms and use the generated text\n        to re-generate images on Z-Image-Turbo, let\u0027s see how well they can do.\n\n- img: prompt-1.webp\n  title: Neural Frames\n  text: |\n        a drawing of a man with glasses smiling and wearing a sweater, a character portrait by Wu Wei, behance, precisionism, cai guo-qiang, steve zheng, chinese artist cai guo qiang\n\n- img: prompt-2.webp\n  title: ImagePrompt.org\n  text: |\n        A caricature-style charcoal pencil drawing of an East Asian man in his 30s, centered in the frame. The subject features an exaggeratedly elongated neck and a large, joyful, toothy grin. He has a buzz-cut hairstyle and wears thin-rimmed circular glasses that frame his crinkled eyes. His expression is one of immense, genuine happiness. The drawing is rendered in a monochromatic black-and-white sketch style, utilizing fine, deliberate cross-hatching and shading lines to define his facial contours, jawline, and the texture of his skin and hair. He is wearing a simple hooded sweatshirt, visible only at the collar. The background is a clean, minimalist off-white surface, focusing all attention on the expressive head-and-shoulders portrait. The lighting appears soft and even, highlighting the prominent smile and the detailed linework of the artist\u0027s shading technique. The overall aesthetic is humorous, artistic, and illustrative.\n\n- img: prompt-3.webp\n  title: Zemith\n  text: |\n        A highly detailed black and white digital illustration in a precise pen-and-ink caricature style depicting a middle-aged East Asian man with a closely cropped buzz cut hairstyle defined by fine directional hatching strokes across the scalp, wearing delicate thin-rimmed round metal eyeglasses that sit slightly forward on his nose with visible earpieces hooking over both ears, his face frozen in an exuberant laughing expression with tightly squinted eyes creating deep crow\u0027s feet wrinkles at the outer corners, raised and furrowed eyebrows, and an enormously wide open mouth stretched into a massive grin that reveals a full set of upper and lower teeth with clearly rendered individual tooth shapes and gaps, prominent nose with defined nostrils, rounded cheeks, and visible laugh lines radiating from the mouth corners, the entire head rendered disproportionately large and bulbous compared to the body, connected by an exaggeratedly long slender neck that stretches downward with smooth contours and dense parallel-line shading to suggest skin texture and cylindrical form, the neck terminating at the bottom of the frame where the hood and upper chest of a casual hoodie appear with cross-hatched fabric texture, visible drawstring ends, and subtle folds, all linework executed with bold confident contour outlines of varying thickness combined with intricate cross-hatching and parallel hatching in all recessed areas such as under the chin, beneath the lower lip, along the neck sides, and within the eye sockets to build volume and depth, subtle stippling accents on the cheeks and forehead for tonal variation, set against a completely plain off-white background with generous negative space surrounding the figure, the composition centered vertically with the oversized head occupying the upper two-thirds of the frame and the elongated neck leading the eye downward, humorous exaggerated proportions, high-contrast black ink against cream paper, clean sharp line quality with no color other than monochrome, polished professional illustration rendering with meticulous attention to every stroke and shadow.\n\n- img: prompt-4.webp\n  title: qwen\n  text: |\n        Caricature portrait of a man with exaggerated features, pen and ink drawing style. Subject has a shaved buzz cut head, round wire-rimmed glasses, and an extremely wide exaggerated smile showing all teeth. Elongated neck and enlarged facial features in caricature style. Detailed cross-hatching and stippling pen work with fine black lines on cream-colored background. The man wears a casual hoodie collar. Black and white line art illustration with intricate hatchingtechniques, highly detailed pen and ink sketch, humorous caricature portrait with joyful expression, professional hand-drawn illustration style.\n\n- img: prompt-5.webp\n  title: qwen\n  text: |\n        男性夸张漫画肖像，钢笔素描风格。人物剃着光头，戴着圆形金属框眼镜，极度夸张的大笑容露出所有牙齿。拉长的脖子和放大的面部特征，漫画风格。精细的交叉排线和点画技法，奶油色背景上的黑色细线。人物穿着休闲连帽衫领口。黑白线条画，复杂的排线技巧，高度细致的钢笔素描，欢乐表情的幽默漫画肖像，专业手绘插画风格。\n\n- img: prompt-6.webp\n  title: gemini\n  text: |\n        A black and white pencil caricature of a smiling East Asian man with a shaved head. He has an exaggeratedly long, thin neck and a huge, wide toothy grin. He wears round, thin wire-rimmed glasses. Clean, off-white paper background, detailed ink cross-hatching, fine line art style.\n\n- img: prompt-7.webp\n  title: gemini\n  text: |\n        一幅黑白鉛筆漫畫，主角是一位微笑的東亞光頭男子。他有著誇張的細長脖子，以及一個巨大的、露齒的寬大笑容。他戴著圓形細金屬絲眼鏡。乾淨的米白色紙張背景，細緻的墨水排線，精細線條藝術風格。\n\n- img: prompt-8.webp\n  title: gemini\n  text: |\n        好像面部特征和表情不能反映原作风格，太写实了，\n        gemini重新生成了提示词\n\n        Core Subject: A highly stylized, extreme black and white ink caricature portrait based on jason4.webp.\n        Facial Features: Must feature an unnaturally wide, massive grin that exposes numerous teeth, far beyond a normal smile. The eyes are crinkled. The man has a clean shaved head and wears round, thin wire-rimmed glasses.\n        Style Details: An excessively long, very thin, elongated neck. A pencil and pen illustration style with dense, intricate cross-hatching to create all textures. Clean, light cream paper background. No colors.\n\n- img: prompt-9.webp\n  title: gemini\n  text: |\n        核心主題： 基於 jason4.webp 的高度風格化、極端的黑白墨水漫畫肖像。\n        面部特徵： 必須具備一個極不自然、巨大的、露出無數牙齒的誇張笑容，遠超常人。雙眼瞇起。男子為光頭，戴著圓形細金屬絲眼鏡。\n        風格細節： 脖子被極度誇大拉長，變得非常細。鉛筆與鋼筆插畫風格，帶有密集、複雜的交叉排線來創造所有紋理。乾淨的淡奶油色紙張背景。無顏色。\n\n- img: prompt-10.webp\n  title: gemini\n  text: |\n        东亚男性的极度夸张的铅笔肖像幽默漫画。视角是人物右前方，大约30度，人物年龄55岁，剃着光头，但有极短的头发，圆形**无框**眼镜，眼睛腿是着很细的钛合金。头部稍微右转看着绘画者方向，极度夸张的大笑容露出所有牙齿，倒三角脸型。拉长的脖子和放大的面部特征，夸张的下巴与锋利的下颌线，眉毛稀疏，面部阴影纹理尽量使用细的稀疏的线条。人物穿着休闲连帽衫领口。Al Hirschfeld style，线条简洁明快，不要使用粗线条，不要使用短细线条。背景是纯白色。 \n\n- img: prompt-11.webp\n  title: gemini\n  text: |\n        东亚男性的极度夸张的铅笔肖像幽默漫画。视角是人物右前方，大约30度，人物年龄55岁，剃着光头，但有极短的头发，圆形**无框**眼镜，眼睛腿是着很细的钛合金。头部稍微右转看着绘画者方向，极度夸张的大笑容露出所有牙齿，倒三角脸型。不要刻意拉长脖子，但放大的面部特征，夸张的下巴与锋利的下颌线，眉毛稀疏，面部阴影纹理尽量使用细的稀疏的线条。人物穿着休闲连帽衫领口。American comic caricature，线条简洁明快，不要使用粗线条，不要使用短细线条。背景是纯白色。 图像尺寸640x640\n\n",
    {
      size: "medium",
      circle: "false",
      shadow: "false",
      blank: "true"
    }
  );

</script>
