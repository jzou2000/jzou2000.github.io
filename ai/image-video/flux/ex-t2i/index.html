    <div id="menu-container"></div>

    


    
    
<div class="van-content-container">
  <div id="index-container" class="van-content-index"></div>
  <div class="van-content">
    <h1>Excercise Text-to-Image</h1>
    <div id="van-list-0" class="van-img-list van-img-list-small"></div>
<script type="module">
import { renderImgYtList } from '/js/img-yt-list.js';

try {
  renderImgYtList('van-list-0', "\n\n- img: girl-on-beach.webp\n  title: \u0022A girl on beach\u0022\n  text: |\n    Realistic photo, full body shot, 8K\n    a girl in her 20s, blonde hair, wearing a yellow hat, bright blue t-shirt and white shorts, standing at beach. She is facing right, raising her right arm straight up holding a tennis racket handle tip, focusing at a tennis ball, about 2 feet above-and-front her head. side sunlight on her left face, natural, moody, smooth skin, a little bit film grain.\n\n- img: girl-on-beach-2.webp\n  title: 女孩在海滩\n  text: |\n    写实照片，全身。女孩20岁，金发，穿浅蓝体恤，白短裤，带黄色帽子，正在作网球发球动作，右手持球拍手柄底部，手臂竖直朝上。网球在她头部前上方约60厘米处。女孩目光对准球。地点是海滩边，温暖的阳光侧照在身上，自然，宁静气氛。少许胶片颗粒。\n\n    step=4\n\n- img: girl-on-beach-3.webp\n  title: 女孩在海滩\n  text: |\n    step=8\n\n",
    {
      size: "small",
      circle: "false",
      shadow: "false",
      blank: "true"
    }
  );
} catch (e) {
  console.error('Error rendering van-list:', e);
}
</script>

  </div>
</div>



    
    
    

    
    <script src="/js/navigation-module.js"></script>
    
  </body>
